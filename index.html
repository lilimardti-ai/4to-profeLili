mark{border-radius:4px;padding:0 2px}

.ex{border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;margin-top:16px}
.opt,.oi{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
.opt.ok{background:#c8f0cb;color:#143;border-color:var(--green)}.opt.no{background:#ffd3d3;color:#411;border-color:var(--red)}
.oi:disabled{opacity:.4}.ol{min-height:30px;padding:6px 10px;background:var(--bg);border-radius:8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row span{flex:1;min-width:200px}
.fb{font-weight:600;min-height:1.4em}
nav.pn{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--gold)}
.pri{background:var(--red);color:#fff;border-color:var(--red)}
.idx button{display:block;width:100%;text-align:left;margin:6px 0}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#md .box{background:var(--card);color:var(--ink);border-radius:16px;max-width:460px;width:100%;padding:20px;border-top:8px solid var(--gold)}
#lg,#tw{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:16px}#lg{z-index:25;align-items:center;justify-content:center}#tw{z-index:28}.in{display:block;width:100%;margin:8px 0;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;display:none;z-index:40;font-size:14px;max-width:90%}
#dip{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow:auto;padding:16px}
.dp{max-width:860px;margin:0 auto;background:#fffdf6;color:#2a2320;border:12px double #b3122f;outline:4px solid #d9a521;padding:24px;text-align:center}
.dp svg.sh{width:110px;height:130px}.dp h1{font-size:34px;color:#b3122f;margin:.2em 0}.dp .nm{font-size:30px;font-weight:700;border-bottom:2px solid #d9a521;display:inline-block;padding:0 24px;margin:8px 0}
@media print{body.pd>*:not(#dip){display:none!important}#dip{position:static;display:block!important;background:#fff;padding:0}.noprint{display:none!important}@page{size:A4 landscape;margin:10mm}}

<script>
const $=s=>document.querySelector(s),m=$('#m'),dip=$('#dip');
const G={dosel:['Dosel','Cubierta de ramas o de tela que forma un techo sobre algo.','Del francés antiguo “dossel”, de “dos” (espalda, respaldo).','Bajo el dosel de la higuera había sombra fresca.'],
simulacro:['Simulacro','Práctica que imita una emergencia real para aprender a actuar.','Del latín “simulacrum”: imagen, copia.','En el simulacro de sismo evacuamos en orden.'],
neurona:['Neurona','Célula del sistema nervioso que recibe y transmite señales.','Del griego “neûron”: nervio.','Una neurona envía el mensaje del dedo al cerebro.'],
axón:['Axón','Prolongación larga de la neurona que envía el impulso nervioso a otras células.','Del griego “áxōn”: eje.','El impulso viaja por el axón.'],
sinapsis:['Sinapsis','Punto de comunicación entre dos neuronas.','Del griego “sýnapsis”: unión.','En la sinapsis se pasan mensajes químicos.'],
quipu:['Quipu','Sistema andino de cuerdas con nudos que guardaba datos y mensajes.','Del quechua “khipu”: nudo.','El quipu registraba la cosecha del año.'],
'impulso nervioso':['Impulso nervioso','Señal eléctrica y química que viaja por las neuronas.','Del latín “impulsus”: empuje.','El impulso nervioso llegó al músculo en milésimas de segundo.'],
reflejo:['Reflejo','Respuesta rápida, automática e involuntaria ante un estímulo.','Del latín “reflexus”: vuelto hacia atrás.','Retiré la mano del fuego por reflejo.'],
cerebelo:['Cerebelo','Parte del encéfalo que coordina el equilibrio y los movimientos.','Del latín: “cerebro pequeño”.','El cerebelo me ayudó a no caerme.'],
totora:['Totora','Planta acuática, tipo junco, con la que se hacen balsas y casas en el lago Titicaca.','Del quechua y aimara “tutura”.','Los uros construyen islas con totora.'],
apu:['Apu','Espíritu protector de una montaña en la cosmovisión andina.','Del quechua “apu”: señor, jefe.','Los pastores piden permiso al apu.'],
pachamama:['Pachamama','La Madre Tierra, deidad andina que da la vida y el sustento.','Del quechua “pacha” (mundo, tierra) y “mama” (madre).','Se agradece a la Pachamama con una ofrenda.']};
const C=[
{t:'Un temblor en el patio',e:'🏫🌳🚨',c:['#7ec8ff','#fff4c2'],x:['La mañana del lunes, el sol de San Juan de Lurigancho se filtraba por el [[dosel]] de la vieja higuera del patio de la I.E. N° 0148. Valeria, Diego y Camila, estudiantes de secundaria, repasaban su tarea de Ciencia y Tecnología cuando la sirena del [[simulacro]] cortó el aire.','—¡Sismo! ¡A la zona segura! —gritó el auxiliar. Valeria reaccionó al instante: dejó el cuaderno, tomó su mochila y avanzó. Diego se quedó paralizado y luego tropezó con una banca. Camila tardó en seguir las indicaciones porque no sabía hacia dónde ir.','—¿Por qué yo me trabé y tú no? —preguntó Diego, avergonzado. Valeria se quedó pensando: ¿qué ocurría dentro del cuerpo de cada uno? Esa pregunta fue el inicio de una gran aventura.'],
ex:{t:'mc',s:1,q:'¿Qué función permite captar un estímulo y generar una respuesta?',o:['La función de relación','La nutrición','La reproducción'],a:0}},
{t:'Las mensajeras del cuerpo',e:'🧠⚡🔬',c:['#c9b6ff','#ffe3f1'],x:['El profesor Ramos dibujó en la pizarra una célula con ramas. —Esta es la [[neurona]] —dijo—. Recibe señales por las dendritas, las procesa en el cuerpo celular y las envía por el [[axón]]. Entre una neurona y otra hay un espacio llamado [[sinapsis]].','—Es como un cartero que lleva cartas —bromeó Diego. —O como un [[quipu]] —añadió Camila—, que guardaba mensajes en cuerdas y nudos. El profesor sonrió: —Exacto. Las neuronas son los mensajeros del cuerpo.'],
ex:{t:'mc',s:1,q:'¿Por qué parte de la neurona sale el mensaje hacia otra célula?',o:['Por las dendritas','Por el axón','Por el espacio de la sinapsis'],a:1}},
{t:'La central y los caminos',e:'🧍📱🛤️',c:['#9be3c1','#e8fbff'],x:['Esa tarde, en el Aula de Innovación Pedagógica, armaron un mapa del cuerpo. —El sistema nervioso central está formado por el encéfalo y la médula espinal —explicó Valeria—. Es la central de mando. El sistema nervioso periférico son los nervios que recorren el cuerpo y llevan información hacia y desde la central.','Camila sintió vibrar su celular en el bolsillo. —¡Ahí! Un nervio sensitivo avisó a mi cerebro, y un nervio motor movió mi mano para sacarlo. Los experimentos empezaban a ser más divertidos que cualquier tarea.'],
ex:{t:'mc',s:1,q:'¿Qué órganos forman el sistema nervioso central?',o:['Encéfalo y médula espinal','Solo los nervios de brazos y piernas','Corazón y pulmones'],a:0}},
{t:'Lo que decido y lo que no',e:'📏✋❤️',c:['#ffd7a8','#fff6d6'],x:['El profesor propuso el primer experimento: la regla que cae. Diego sostuvo una regla de 30 cm; Valeria puso sus dedos abajo, sin tocarla. Cuando Diego la soltó, Valeria la atrapó en la marca de 14 cm. —Mi cerebro recibió la imagen, decidió y ordenó a mi mano cerrarse —explicó—. Eso es un acto voluntario.','—¿Y los latidos de mi corazón al correr al patio? —preguntó Camila. —Son actos involuntarios —respondió el profesor—: no los decides, el cuerpo los controla solo. Así viaja el [[impulso nervioso]]: una señal eléctrica y química que corre por las neuronas en milésimas de segundo.'],
ex:{t:'mc',s:1,q:'¿Cuál es un acto involuntario?',o:['Atrapar una regla que cae','Escribir en el cuaderno','Los latidos del corazón'],a:2}},
{t:'Reflejos y equilibrio',e:'🦵🤸⚖️',c:['#ffb3b3','#fff0e0'],x:['—Ahora, los [[reflejo]]s —dijo Ramos. Camila se sentó con las piernas colgando y Diego golpeó suavemente debajo de su rodilla: ¡su pierna saltó sola! —¡No quise moverla! —rió Camila. —El impulso fue a la médula espinal y volvió sin esperar al cerebro.','Luego probaron el equilibrio: pararse en un pie con los ojos cerrados. Diego se tambaleó enseguida. —Tu [[cerebelo]] coordina el equilibrio y los movimientos —dijo Valeria—. Si lo entrenas, reaccionarás mejor en un simulacro.'],
ex:{t:'mc',s:1,q:'¿Qué parte del encéfalo coordina el equilibrio?',o:['El cerebelo','La médula espinal','Las dendritas'],a:0}},
{t:'La leyenda de la abuela Rosa',e:'⛰️🌾👵',c:['#b7d9ff','#e9f7d0'],x:['El sábado visitaron a la abuela Rosa, que vivía en lo alto del cerro. Les sirvió chocolate caliente y les contó que, en su tierra puneña, hacían balsas de [[totora]] sobre el lago. —Los antiguos creían que el [[apu]] vigilaba el cerro y que la [[pachamama]] avisaba cuando iba a temblar —dijo.','—Dicen que el apu susurra advertencias a quien sabe escuchar —añadió. Valeria sonrió: —Abuela, ¡hoy sabemos escuchar con ciencia! Y se le ocurrió una idea: construir un aparato que escuchara a la tierra. Camila anotó: “Mi cerebro es una central de mando; mis reflejos, veloces como un rayo”.'],
ex:{t:'cls',s:2,q:'Clasifica cada frase según su figura literaria:',cats:['metáfora','símil','personificación'],it:[['Tu cerebro es una central de mando','metáfora'],['Sus reflejos eran veloces como un rayo','símil'],['El apu susurra advertencias a quien escucha','personificación']]}},
{t:'El taller de la alarma',e:'🔧🔔🧪',c:['#ffe28a','#d8f3ff'],x:['Durante dos semanas, el Aula de Innovación se llenó de cartón, cables y risas. Usaron materiales económicos y reciclados: una botella de plástico, un clip metálico, papel aluminio, dos pilas, un zumbador pequeño y cables. Montaron dos láminas de aluminio en la base, sin tocarse, y un clip colgado de un hilo sobre ellas.','Cuando el suelo vibraba, el clip se balanceaba, tocaba las láminas y cerraba el circuito: ¡el zumbador sonaba! —Funciona como una neurona —dijo Camila—: detecta un estímulo y envía una señal. —Es nuestro sensor, nuestro nervio y nuestra alarma —sonrió Diego.'],
ex:{t:'mc',s:1,q:'¿Qué hace sonar el zumbador de la alarma casera?',o:['El clip toca el aluminio y cierra el circuito','Se enciende con la luz del sol','Suena cuando se enfría la botella'],a:0}},
{t:'La noche del gran sismo',e:'🌃🏠🏃',c:['#3b3b7a','#ffb36b'],x:['Una noche de mayo, un temblor real sacudió Lima. Valeria despertó, sintió el movimiento y su cuerpo respondió: su corazón se aceleró. En el pasillo, la alarma casera zumbaba con fuerza. —¡Abuela, Diego, a la zona segura! —Siguieron la ruta de evacuación, tranquilos y coordinados, tal como lo habían practicado.','Al día siguiente, en el colegio, todos aplaudieron el invento. Diego, sin tropezar, ayudó a evacuar a los de primer año. Valeria comprendió que conocer su cuerpo y prevenir salvaban vidas.'],
ex:{t:'ord',s:2,q:'Ordena la historia (inicio, nudo y desenlace):',it:['Suena el simulacro y Diego se paraliza','Los amigos investigan neuronas y reflejos','Construyen una alarma sísmica casera','La alarma avisa durante un sismo real']}}];
const P=[{k:'p'},{k:'i'},...C.map((_,i)=>({k:'c',i})),{k:'w'},{k:'f'}];
let cur=0,hl=null,done={},er={},ft={},stars=0,seen=new Set([0]),H={},fs=19,ord=[];
const TOTAL=P.length+C.length;
let ac;function tone(f,t,d,ty){ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}
function sfx(k){try{if(k=='ok'){tone(660,0,.12);tone(880,.12,.2)}else if(k=='bad'){tone(180,0,.3,'sawtooth')}else{[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.25,'triangle'))}}catch(e){}}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3200)}
function speak(s){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='es-PE';u.rate=.9;speechSynthesis.speak(u)}catch(e){toast('Tu navegador no admite voz')}}
const LV={AD:['Logro destacado','supera las expectativas y va más allá de lo esperado.'],A:['Logro esperado','cumple satisfactoriamente con las competencias.'],B:['En proceso','está cerca del nivel esperado y requiere acompañamiento.'],C:['En inicio','muestra un progreso mínimo o presenta dificultades.']};
function lvl(){const n=Object.keys(done).length;if(!n)return null;const f=Object.keys(ft).filter(k=>ft[k]).length/n;return f>=.85?'AD':f>=.65?'A':f>=.4?'B':'C'}
function upd(){const n=Object.keys(done).length,p=Math.round((seen.size+n)/TOTAL*100);$('#st').textContent='⭐ '+stars;$('#pb').style.width=p+'%';$('#pc').textContent=p+'%';$('#nv').textContent=lvl()?'Nivel: '+lvl():''}
const gl=s=>s.replace(/\[\[([^\]]+)\]\](\w*)/g,(a,k,x)=>`<span class="gl" data-g="${k}">${k}${x}</span>`);
